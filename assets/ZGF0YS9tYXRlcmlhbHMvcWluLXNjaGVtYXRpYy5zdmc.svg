<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" role="img" aria-labelledby="title desc"><title id="title">秦统一空间与时序示意</title><desc id="desc">秦立足关中，向东方六国推进。前230年至前221年相继灭六国。图示不表示精确疆界或距离。</desc><rect width="900" height="240" fill="#eef4f2"/><g fill="#143f45" font-family="sans-serif" text-anchor="middle"><text x="170" y="80" font-size="28">秦国（关中）</text><text x="680" y="80" font-size="28">东方六国</text><text x="450" y="170" font-size="24">前230年 → 前221年</text><text x="450" y="211" font-size="16">空间与时序示意；不表示精确疆界、距离或逐次路线</text></g><path d="M280 105H605l-18-12m18 12-18 12" stroke="#143f45" stroke-width="5" fill="none"/></svg>
